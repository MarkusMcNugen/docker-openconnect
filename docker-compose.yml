services:
  openconnect:
    image: markusmcnugen/openconnect:latest
    container_name: openconnect
    restart: unless-stopped
    ports:
      - "4443:4443/tcp"
      - "4443:4443/udp"
      # The admin panel, reachable from this host only:
      # - "127.0.0.1:8443:8443/tcp"
    environment:
      SRV_CN: vpn.example.com
      # PANEL_ENABLED: "true"
      # TUNNEL_MODE: split-include
      # TUNNEL_ROUTES: 192.168.1.0/24
      # DNS_SERVERS: 192.168.1.1
      # CAMOUFLAGE_SECRET: choose-a-long-random-string
    volumes:
      - ./config:/config
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - KILL
      - NET_ADMIN
      - NET_BIND_SERVICE
      - NET_RAW
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /run
      - /tmp
    sysctls:
      net.ipv4.ip_forward: 1
      net.ipv6.conf.all.forwarding: 1
      net.ipv6.conf.all.disable_ipv6: 0
      net.ipv6.conf.default.disable_ipv6: 0
