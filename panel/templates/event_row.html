<li class="ev" data-kind="{{ row.kind }}"><span class="ev-ic {{ row.tone }}"><svg class="ic-sm" viewBox="0 0 256 256" aria-hidden="true"><path d="{{ row.icon }}"></path></svg></span><div class="ev-body"><p class="ev-t">{{ row.text }}</p>{% if !row.meta.is_empty() || row.place.is_some() %}<p class="ev-m">{% if let Some(place) = row.place %}<span class="place"><img class="flag" src="{{ place.flag }}" alt="">{{ place.name }}</span>{% if !row.meta.is_empty() %} · {% endif %}{% endif %}{{ row.meta }}</p>{% endif %}</div><time class="ev-time" datetime="{{ row.stamp }}" data-local-time>{{ row.clock }} UTC</time></li>
