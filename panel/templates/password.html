{% extends "base.html" %}
{% block body %}
<main class="signin">
<section class="card signin-card" aria-labelledby="signin-title">
<div class="signin-head">
<img class="logo-lg" src="{{ page.logo }}" alt="">
<h1 id="signin-title">{{ heading }}</h1>
<p>{{ intro }}</p>
</div>
{% if let Some(error) = error %}
<div class="callout callout-bad" role="alert"><svg class="ic" viewBox="0 0 256 256" aria-hidden="true"><path d="{{ warning }}"></path></svg><span>{{ error }}</span></div>
{% endif %}
<form class="stack" method="post" action="/password">
<input type="hidden" name="csrf" value="{{ csrf }}">
<div class="field"><label class="label" for="current">Current password</label><input class="input" id="current" name="current" type="password" autocomplete="current-password" required></div>
<div class="field"><label class="label" for="new">New password</label><input class="input" id="new" name="new" type="password" autocomplete="new-password" minlength="{{ min_length }}" required></div>
<div class="field"><label class="label" for="repeat">New password again</label><input class="input" id="repeat" name="repeat" type="password" autocomplete="new-password" minlength="{{ min_length }}" required></div>
<p class="hint">At least {{ min_length }} characters. Your other sessions end when it changes.</p>
<button class="btn btn-primary btn-block" type="submit">Change password</button>
</form>
{% if back %}<p class="signin-foot"><a href="/account">Back to your account</a></p>{% endif %}
</section>
</main>
{% endblock %}
